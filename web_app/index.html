<!DOCTYPE html>
<html lang="en" data-api-base="https://arxiv-trend-predictor-api-001.onrender.com">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>arXiv Trend Advisor</title>
  <link rel="icon" href="favicon.ico" sizes="32x32" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#5B4FD9" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page">
    <header class="header">
      <h1 class="title">arXiv Trend Advisor</h1>
      <p class="tagline">See where your idea fits and how it trends on arXiv.</p>
    </header>

    <main class="main">
      <form id="advise-form" class="form" novalidate>
        <div class="field">
          <label for="title">Title</label>
          <input
            id="title"
            name="title"
            type="text"
            placeholder="e.g. Neural Radiance Fields for View Synthesis"
            required
            autocomplete="off"
          />
        </div>
        <div class="field">
          <label for="abstract">Abstract</label>
          <textarea
            id="abstract"
            name="abstract"
            rows="5"
            placeholder="Optional: paste or type your abstract..."
            autocomplete="off"
          ></textarea>
        </div>
        <div class="form-actions">
          <button type="submit" id="submit-btn" class="btn btn-primary">
            Run analysis
          </button>
          <div class="example-actions">
            <button type="button" class="btn btn-example" data-example="1">Eg 1 — Transformers</button>
            <button type="button" class="btn btn-example" data-example="2">Eg 2 — NeRF</button>
          </div>
        </div>
      </form>
      <p class="form-note">Click <strong>Run analysis</strong> to run analysis. Click <strong>Eg 1 — Transformers</strong> or <strong>Eg 2 — NeRF</strong> to fill the title and abstract automatically with an example.</p>
      <p id="status" class="status status-below-note" aria-live="polite"></p>

      <section id="result" class="result hidden" aria-live="polite">
        <div class="result-inner">
          <h2 class="result-heading">Advice</h2>
          <div id="viz-section" class="viz-section hidden">
            <p class="viz-section-title">Insights</p>
            <div class="charts-row">
              <div class="chart-wrap chart-wrap-tall">
                <canvas id="chart-confidence" aria-label="Domain confidence bar chart"></canvas>
              </div>
              <div class="chart-wrap chart-wrap-tall">
                <canvas id="chart-growth" aria-label="Category growth gauge"></canvas>
              </div>
              <div class="chart-wrap scatter-wrap">
                <canvas id="chart-scatter" aria-label="Confidence vs growth scatter"></canvas>
              </div>
            </div>
            <div id="viz-numbers" class="viz-numbers" aria-live="polite"></div>
          </div>
          <div id="result-domain" class="card domain-card"></div>
          <div id="result-growth" class="card growth-card"></div>
        </div>
      </section>

      <section id="error" class="error hidden" role="alert">
        <p id="error-message"></p>
      </section>
    </main>

    <footer class="footer footer-compact footer-bar">
      <p class="footer-links footer-links-one-line">
        <a href="creators.html">Creators</a>
        <span aria-hidden="true">·</span>
        <a href="https://github.com/dkethan/arxiv-trend-predictor" target="_blank" rel="noopener">Project Link</a>
        <span aria-hidden="true">·</span>
        <a href="privacy-policy.html">Privacy Policy</a>
      </p>
    </footer>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
