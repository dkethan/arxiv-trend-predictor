# Render Blueprint: arxiv-trend-predictor backend
# See https://docs.render.com/blueprint-spec

services:
  - type: web
    name: arxiv-trend-predictor-api
    runtime: python

    buildCommand: pip install -r requirements.txt
    startCommand: python -m backend.main

    healthCheckPath: /health

